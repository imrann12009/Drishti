name: drishti

description: DRISHTI — an accessibility-first AI pocket navigator foundation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.6
  camera: ^0.12.1
  google_mlkit_commons: ^0.13.0
  google_mlkit_object_detection: ^0.17.1
  flutter_blue_plus: ^2.3.14
  http: ^1.5.0
  in_app_purchase: ^3.3.1
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.1
  # Remote, read-only release metadata. A Firebase project configuration is
  # deliberately not committed to this repository.
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  package_info_plus: ^8.3.1
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  crypto: ^3.0.6
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/drishti_vision_wave_logo.png
