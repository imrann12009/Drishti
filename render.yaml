services:
  - type: web
    name: drishti-ai-server
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm ci && npm run check
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      # Set this in Render after the Flutter web site URL is known. Do not use *.
      - key: CORS_ORIGINS
        sync: false
